<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satelites</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="Vevi.png" type="image/png">
  <style>
    .btn {
      padding: 8px 16px;
      margin: 4px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    iframe {
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Satelites</h1>

  <a href="Satelites/Create.html"><button class="btn">Add Satelite</button></a><br><br>
  <a href="Satelites/Edit.html"><button class="btn">Edit Satelite</button></a><br><br>

  <form onsubmit="handleImport(event)">
    <input type="file" accept=".vsa" id="vsaFileInput"><br>
    <button type="submit" class="btn">Import</button>
  </form><br><br>

  <main>
    <section id="satelite-gallery">
      <p id="empty-msg">There are no <b>Satelites</b> yet</p>
    </section>
  </main>

  <iframe id="preview-frame"></iframe>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const savedCards = localStorage.getItem("volt_satelites");
      if (savedCards) {
        const gallery = document.getElementById("satelite-gallery");
        document.getElementById("empty-msg")?.remove();
        gallery.innerHTML += savedCards;
      }
    });

    function handleImport(event) {
      event.preventDefault();

      const fileInput = document.getElementById("vsaFileInput");
      const file = fileInput.files[0];
      if (!file) {
        alert("Please select a volt site extension file first.");
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        const content = reader.result;

        const name = content.match(/<satname>(.*?)<\/satname>/)?.[1] || "Unnamed";
        const desc = content.match(/<satdesc>(.*?)<\/satdesc>/)?.[1] || "No description";
        const vsid = content.match(/<vsid>(.*?)<\/vsid>/)?.[1] || "0000";
        const htmlStart = content.indexOf("<!DOCTYPE html>");
        const fullHTML = htmlStart >= 0 ? content.slice(htmlStart) : "<p>No HTML found</p>";

        if (!/^\d{4}$/.test(vsid)) {
          alert("Invalid VSID. Must be exactly 4 digits.");
          return;
        }

        const cardHTML = `
          <div data-vsid="${vsid}">
            <p>Name: ${name}</p>
            <h6>Description: ${desc}</h6>
            <button class="btn" onclick="loadIntoIframe('${vsid}')">Visit</button>
            <button class="btn" onclick="exportSatelite(this.parentElement)">Export</button>
          </div>
        `;

        const gallery = document.getElementById("satelite-gallery");
        document.getElementById("empty-msg")?.remove();
        gallery.innerHTML += cardHTML;

        const existingCards = localStorage.getItem("volt_satelites") || "";
        localStorage.setItem("volt_satelites", existingCards + cardHTML);
        localStorage.setItem(`volt_html_${vsid}`, fullHTML);
      };
      reader.readAsText(file);
    }

    function loadIntoIframe(vsid) {
      const html = localStorage.getItem(`volt_html_${vsid}`);
      if (!html) {
        alert("No preview available.");
        return;
      }

      const iframe = document.getElementById("preview-frame");
      iframe.srcdoc = html;
    }

    function exportSatelite(div) {
      const name = div.querySelector("p")?.textContent?.replace("Name: ", "").trim() || "Unnamed";
      const desc = div.querySelector("h6")?.textContent?.replace("Description: ", "").trim() || "No description";
      const href = div.querySelector("a")?.getAttribute("href")?.trim() || "#";
      const vsid = div.getAttribute("data-vsid") || "0000";

      if (!/^\d{4}$/.test(vsid)) {
        alert("Invalid VSID. Must be exactly 4 digits.");
        return;
      }

      fetch(href)
        .then(res => {
          if (!res.ok) throw new Error("Failed to fetch page");
          return res.text();
        })
        .then(html => {
          const metadata = `<satname>${name}</satname>\n<satdesc>${desc}</satdesc>\n<saturl>${href}</saturl>\n<vsid>${vsid}</vsid>\n`;
          const vsaContent = metadata + html;

          const blob = new Blob([vsaContent], { type: "text/plain" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `${name}.vsa`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        })
        .catch(err => {
          alert("Could not fetch satellite.");
          console.error(err);
        });
    }
  </script>
</body>
</html>
