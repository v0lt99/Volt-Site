<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="v0lt99">
  <meta name="name" content="Volt Site">
  <meta name="description" content="Volt Site is a simple site created by v0lt99">
  <title>Volt Site</title>
  <link rel="icon" href="Vevi.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <style>
    /* Loading Overlay */
    #loading-overlay {
      padding: 100%;
      position: fixed;
      inset: 0;
      background-color: #1400ff;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      font-size: 22px;
      z-index: 9999;
      flex-direction: column;
      transition: opacity 0.5s ease;
    }

    #loading-step {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
  </style>
</head>

<body>
  <!-- Loading Overlay -->
  <span id="loading-overlay">
    <span id="loading-step">loading assets</span>
  </span>

  <header>
    <span style="background-color: #000000; position: fixed; margin: 5px; width: 100%; top: 0px;">
        <h1>Volt Site&trade;</h1>
        <form action="search.html" method="GET">
          <input id="search" type="text" name="q" placeholder="Search Volt Site..." style="border-radius: 10px; background-color: white; padding: 5px 15px">
        </form>
    </span><br><br><br><br><br><br>
    
    <nav id="nav">
      <a href="news.html"><button class="btn">News</button></a><br>
      <a href="content.html"><button class="btn">Content</button></a><br>
      <a href="updates.html"><button class="btn">Update Log</button></a><br>
      <a href="satelite.html"><button class="btn">Satelites</button></a><br>
    </nav>
  </header>

  <main>
    <section>
      <h2>Welcome to Volt Site</h2>
      <p>This is a simple site built by <a href="https://github.com/v0lt99" target="_blank">Volt Flare</a>.</p>
      <iframe id="bloxd.io" src="https://bloxd.io" style="height: 400px; width: 600px;" alt="Play bloxd with friends"></iframe>
    </section>
  </main>

  <footer>
    <a href="https://v0lt99.github.io/Volt-Site"><img alt="qrcode" src="qrcode_v0lt99.github.io.svg" style="height: 200px; width: 200px"></a>
    <p>Scan to visit Volt Site on mobile (easily)</p>
    <a href="https://github.com/v0lt99/Volt-Site/wiki" target="_blank"><button class="btn">View the wiki</button></a>
    <p>&copy; 2025 Volt Flare. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script>
    const steps = ["Loading Assets", "Initiating Scripts", "Launching Site"];
    const stepElement = document.getElementById("loading-step");
    const overlay = document.getElementById("loading-overlay");

    let currentStep = 0;

    function showStep(index) {
      stepElement.style.opacity = 0;
      setTimeout(() => {
        stepElement.textContent = steps[index];
        stepElement.style.opacity = 1;
      }, 500);
    }

    function nextStep() {
      if (currentStep < steps.length) {
        showStep(currentStep);
        currentStep++;
        setTimeout(nextStep, 5000);
      } else {
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.style.display = "none";
        }, 5000);
      }
    }

    window.addEventListener("load", () => {
      nextStep();
    });
  </script>
