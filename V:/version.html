<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>V:/version</title>
  <style>
    body {
      margin: 0;
      font-family: Segoe UI, sans-serif;
      background-color: #1e1e1e;
      color: #d4d4d4;
    }

    header {
      background-color: #252526;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    main {
      padding: 20px;
    }

    .version-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #2b2d31;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      width: 400px;
      margin: 40px auto;
      text-align: center;
    }

    .version-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .version-info {
      font-size: 16px;
      color: #b5bac1;
    }
  </style>
</head>
<body>
  <header>V:/version</header>
  <main>
    <span class="version-box">
      <span class="version-title">System Version</span>
      <span class="version-info">V: runner v1.2.0</span>
      <span class="version-info">Build: 30/07/2025</span>
    </span>
  </main>
</body>
</html>
