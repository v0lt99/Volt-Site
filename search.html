<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search - Volt Site</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .brand {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
    }
    .brand a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .search-box {
      margin-top: 100px;
    }
    .search-box input {
      width: 60%;
      padding: 15px;
      font-size: 20px;
      border-radius: 40px;
      border: none;
      outline: none;
      text-align: center;
    }

    #aiResponse {
      margin-top: 40px;
      padding: 20px;
      background: #111;
      border: 2px solid #0ff;
      border-radius: 15px;
      width: 60%;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }

    #results {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    h3 {
      margin-top: 40px;
      font-size: 22px;
      color: #0ff;
    }

    .result {
      background: rgb(20, 0, 255);
      padding: 20px;
      width: 60%;
      border-radius: 15px;
      text-align: left;
    }

    .result b {
      font-size: 18px;
    }

    .result h6 {
      margin: 8px 0;
      font-weight: normal;
    }

    .result button {
      background: #fff;
      color: rgb(20,0,255);
      border: none;
      padding: 8px 15px;
      border-radius: 10px;
      cursor: pointer;
    }

    .result button:hover {
      background: #ddd;
    }

    .no-results {
      color: #aaa;
      margin-top: 40px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <!-- Branding -->
  <div class="brand">
    <a href="index.html">Volt Site</a>
  </div>

  <!-- Search box -->
  <div class="search-box">
    <form id="searchForm">
      <input type="text" id="query" placeholder="Search Volt Site...">
    </form>
  </div>

  <!-- AI Response -->
  <div id="aiResponse" style="display:none;">
    <h3>AI response:</h3>
    <div id="aiText"></div>
  </div>

  <!-- Results -->
  <div id="results"></div>

  <script>
    const VoltSite = {
      Pages: [
        { name: "Home", desc: "Visit the home page", url: "index.html" },
        { name: "Satelites", desc: "Explore satelites on Volt Site", url: "satelites.html" },
        { name: "Content", desc: "Second layer of content in Volt Site", url: "content.html" },
        { name: "Updates", desc: "View the latest updates in Volt Site", url: "updates.html" }
      ],
      satelites: [
        { name: "Example satelite", desc: "This is an example satelite", url: "satelites/Volt/Example.html" }
      ]
    };

    const searchForm = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const resultsDiv = document.getElementById("results");
    const aiResponseDiv = document.getElementById("aiResponse");
    const aiText = document.getElementById("aiText");

    function generateAIResponse(query) {
      const q = query.toLowerCase();

      if (q.includes("bug")) {
        return `
        <strong>Bugs are everywhere</strong><br><br>
        The two bugs are:<br>
        &nbsp;&nbsp;- <b>Formal bugs</b>(developer mistakes)<br>
        &nbsp;&nbsp;- <b>Informal bugs</b>(viruses planted by hackers)<br><br>
        If you see a bug, report to the admin.
        `;
      } else if (q.includes("hi")) {
        return `Hello i am <b>Sache AI</b>, nice to meet you.`
      } else if (q.includes("code")) {
        return `Volt Site uses modular JavaScript objects to organize sections. Search logic parses names and descriptions dynamically.`;
      } else if (q.includes("anouncement")) {
        return `Anouncements are words that developers try to tell you, that is why they always add a "by:" tag.`
      } else if (q.includes("volt"))
        return `Volt is the creator of <b>Volt Site</b>, you could get admin access depending on luck.`
      } else {
        return `Sorry, I was not taught that yet.`;
      }
    }

    function renderResults(q) {
      resultsDiv.innerHTML = "";
      const query = q.toLowerCase();
      let found = false;

      // AI Response
      const aiAnswer = generateAIResponse(query);
      aiText.innerHTML = aiAnswer;
      aiResponseDiv.style.display = "block";

      // Search Results
      for (const section in VoltSite) {
        const matches = VoltSite[section].filter(item =>
          item.name.toLowerCase().includes(query) ||
          item.desc.toLowerCase().includes(query)
        );

        if (matches.length > 0) {
          found = true;

          const header = document.createElement("h3");
          header.textContent = section;
          resultsDiv.appendChild(header);

          matches.forEach(item => {
            const div = document.createElement("div");
            div.className = "result";
            div.innerHTML = `
              <b>${item.name}</b>
              <h6>${item.desc}</h6>
              <a href="${item.url}" target="_blank"><button>Visit</button></a>
            `;
            resultsDiv.appendChild(div);
          });
        }
      }

      if (!found) {
        const noResult = document.createElement("div");
        noResult.className = "no-results";
        noResult.innerHTML = `There are no <b>Wiki</b>s here.`;
        resultsDiv.appendChild(noResult);
      }
    }

    // Load query from URL
    const urlParams = new URLSearchParams(window.location.search);
    const q = urlParams.get("q");
    if (q) {
      queryInput.value = q;
      renderResults(q);
    }

    // Handle form submit
    searchForm.addEventListener("submit", e => {
      e.preventDefault();
      const q = queryInput.value.trim();
      if (!q) return;
      window.history.replaceState({}, "", `?q=${encodeURIComponent(q)}`);
      renderResults(q);
    });
  </script>
</body>
</html>
