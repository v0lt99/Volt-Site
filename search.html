<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search - Volt Site</title>
  <link rel="icon" href="Vevi.png" type="image/png">

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    /* Branding */
    .brand {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
    }

    .brand a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    /* Search box */
    .search-box {
      margin-top: 100px;
    }

    .search-box input {
      width: 60%;
      padding: 15px;
      font-size: 20px;
      border-radius: 40px;
      border: none;
      outline: none;
      text-align: center;
    }

    /* AI Response */
    #aiResponse {
      margin-top: 40px;
      padding: 20px;
      background: #111;
      border: 2px solid #0ff;
      border-radius: 15px;
      width: 60%;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
      white-space: pre-wrap;
    }

    /* Results */
    #results {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    h3 {
      margin-top: 40px;
      font-size: 22px;
      color: #0ff;
    }

    .result {
      background: rgb(20, 0, 255);
      padding: 20px;
      width: 60%;
      border-radius: 15px;
      text-align: left;
    }

    .result h2 {
      font-size: 18px;
    }

    .result h6 {
      margin: 8px 0;
      font-weight: normal;
    }

    .result a button {
      background-color: #fff;
      color: #000;
      border: none;
      padding: 5px 15px;
      border-radius: 10px;
      cursor: pointer;
    }

    .result a button:hover {
      background-color: rgba(255, 255, 255, 0.5);
    }

    .no-results {
      color: #aaa;
      margin-top: 40px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="brand">
    <a href="index.html">Volt Site</a>
  </div>

  <div class="search-box">
    <form id="searchForm">
      <input type="text" id="query" placeholder="Search Volt Site...">
    </form>
  </div>

  <section id="aiResponse" style="display:none;">
    <h3>AI response:</h3>
    <div id="aiText"></div>
  </section>

  <section id="results"></section>

  <script>
    const REPO = 'v0lt99/Volt-Site';
    let repoFiles = [];

    // 1) Load the GitHub repo tree + file contents
    async function loadRepoIndex() {
      const treeRes = await fetch(`https://api.github.com/repos/${REPO}/git/trees/main?recursive=1`);
      const treeJson = await treeRes.json();
      const blobs = treeJson.tree.filter(f =>
        f.type === 'blob' && /\.(html|js|css)$/.test(f.path)
      );

      // Fetch each file's text
      const fetches = blobs.map(async file => {
        const rawUrl = `https://raw.githubusercontent.com/${REPO}/main/${file.path}`;
        const txt = await fetch(rawUrl).then(r => r.ok ? r.text() : '');
        return { path: file.path, content: txt };
      });

      repoFiles = await Promise.all(fetches);
      console.log('✅ Repo indexed:', repoFiles.map(f => f.path));
    }

    // 2) Generate AI-style response by scanning the index
    async function generateAIResponse(query) {
      query = query.toLowerCase();

      if (!repoFiles.length) {
        return '🔄 Repository still loading... please wait a moment and search again.';
      }

      // Find files whose path or content matches
      const matches = repoFiles.filter(f =>
        f.path.toLowerCase().includes(query) ||
        f.content.toLowerCase().includes(query)
      );

      if (!matches.length) {
        return '❌ No matches found in the Volt-Site repository.';
      }

      // Build a snippet list
      let resp = `🔍 Found ${matches.length} file(s) matching "${query}":\n\n`;
      matches.slice(0, 5).forEach(f => {
        const idx = f.content.toLowerCase().indexOf(query);
        const snippet = idx > -1
          ? f.content.substr(Math.max(0, idx - 40), query.length + 80).replace(/\n/g, ' ')
          : '[match in filename]';

        resp += `• ${f.path}\n   …${snippet}…\n\n`;
      });

      if (matches.length > 5) {
        resp += `And ${matches.length - 5} more files.`;
      }

      return resp;
    }

    // 3) Render results + show AI response
    async function renderResults(q) {
      document.getElementById('results').innerHTML = '';
      document.getElementById('aiResponse').style.display = 'block';

      const aiAnswer = await generateAIResponse(q);
      document.getElementById('aiText').textContent = aiAnswer;

      // For structure consistency: still list official Pages & Satellites
      let found = false;
      ['Pages','Satelites'].forEach(section => {
        const items = VoltSite[section].filter(item =>
          item.name.toLowerCase().includes(q.toLowerCase()) ||
          item.desc.toLowerCase().includes(q.toLowerCase())
        );

        if (items.length) {
          found = true;
          const hdr = document.createElement('h3');
          hdr.textContent = section;
          document.getElementById('results').append(hdr);

          items.forEach(item => {
            const art = document.createElement('article');
            art.className = 'result';
            art.innerHTML = `
              <h2>${item.name}</h2>
              <h6>${item.desc}</h6>
              <a href="${item.url}" target="_blank"><button>Visit</button></a>
            `;
            document.getElementById('results').append(art);
          });
        }
      });

      if (!found) {
        const none = document.createElement('article');
        none.className = 'no-results';
        none.innerHTML = `There are no <b>Services</b> here.`;
        document.getElementById('results').append(none);
      }
    }

    // VoltSite index from your original script
    const VoltSite = {
      Pages: [
        { name: "Home", desc: "Visit the home page", url: "index.html" },
        { name: "Satelites", desc: "Explore satelites on Volt Site", url: "satelites.html" },
        { name: "News", desc: "Keep track of news in Volt Site with ease", url: "news.html" },
        { name: "Content", desc: "Second layer of content in Volt Site", url: "content.html" },
        { name: "Updates", desc: "View the latest updates in Volt Site", url: "updates.html" }
      ],
      Satelites: [
        { name: "Create", desc: "Create a satelite", url: "Satelites/Create.html" },
        { name: "Edit", desc: "Edit your satelite, After you verify your VSID", url: "Satelites/Edit.html" }
      ]
    };

    // Initialize
    loadRepoIndex();

    // Handle URL-prefilled query
    const params = new URLSearchParams(window.location.search);
    const initialQ = params.get('q');
    if (initialQ) {
      document.getElementById('query').value = initialQ;
      renderResults(initialQ);
    }

    // Form submit
    document.getElementById('searchForm').addEventListener('submit', e => {
      e.preventDefault();
      const q = document.getElementById('query').value.trim();
      if (!q) return;
      window.history.replaceState({}, '', `?q=${encodeURIComponent(q)}`);
      renderResults(q);
    });
  </script>
</body>
</html>
